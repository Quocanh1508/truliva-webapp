name: Strix AI Penetration Testing & Vulnerability Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: local test instance)"
        required: false
        default: "http://localhost:3000"
      model_provider:
        description: "LLM Model Provider"
        required: false
        default: "google"
        type: choice
        options:
          - google
          - openai
          - anthropic
  schedule:
    # Chạy quét định kỳ tự động mỗi tuần (0h00 Thứ 2)
    - cron: '0 0 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  strix-security-scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truliva_test
          POSTGRES_PASSWORD: truliva_test_password
          POSTGRES_DB: truliva_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python 3.12 (For Strix)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Docker is available (Required by Strix Sandbox)
        run: |
          docker --version
          docker info --format '{{.ServerVersion}}' || echo "Docker daemon info not available"

      - name: Install Strix CLI Agent
        run: |
          python -m pip install --upgrade pip
          pip install strix-agent
          strix --version || echo "Strix installed but version flag may not exist"
          which strix

      - name: Install Truliva Dependencies & Migrate Test Database
        env:
          DATABASE_URL: "postgresql://truliva_test:truliva_test_password@localhost:5432/truliva_test_db?schema=public"
          JWT_SECRET: "test_jwt_secret_strix_security_scan_key"
        run: |
          npm install --legacy-peer-deps
          npx prisma db push --accept-data-loss
          npx prisma generate
          npx tsc || true

      - name: Start Truliva Backend in Background
        env:
          PORT: 3000
          DATABASE_URL: "postgresql://truliva_test:truliva_test_password@localhost:5432/truliva_test_db?schema=public"
          JWT_SECRET: "test_jwt_secret_strix_security_scan_key"
          NODE_ENV: "test"
        run: |
          node dist/index.js &
          echo "Waiting for server to start..."
          sleep 15
          echo "=== Checking server health ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:3000/ || echo "Server may not be fully ready"
          curl -s http://localhost:3000/api/health 2>/dev/null || echo "No /api/health endpoint, but server may still be running"

      - name: Run Strix Autonomous AI Pentest Scan
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_provider || 'google' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIX_LLM: "gemini/gemini-2.0-flash"
        run: |
          mkdir -p reports/security
          echo "=============================================="
          echo "  STRIX AI PENETRATION TESTING"
          echo "=============================================="
          
          # Thiết lập STRIX_LLM và LLM_API_KEY tương thích với LiteLLM
          if [ "$MODEL_CHOICE" = "google" ] || [ -n "$GEMINI_API_KEY" ]; then
            echo "Provider: Google Gemini (gemini-2.0-flash)"
            export STRIX_LLM="gemini/gemini-2.0-flash"
            export LLM_API_KEY="$GEMINI_API_KEY"
            export GEMINI_API_KEY="$GEMINI_API_KEY"
          elif [ "$MODEL_CHOICE" = "anthropic" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Provider: Anthropic Claude"
            export STRIX_LLM="anthropic/claude-3-5-sonnet-20241022"
            export LLM_API_KEY="$ANTHROPIC_API_KEY"
          else
            echo "Provider: OpenAI GPT-4o"
            export STRIX_LLM="openai/gpt-4o"
            export LLM_API_KEY="$OPENAI_API_KEY"
          fi
          
          TARGET_URL="${{ github.event.inputs.target_url || 'http://localhost:3000' }}"
          echo "Target:   $TARGET_URL"
          echo "Model:    $STRIX_LLM"
          echo "API Key:  ${LLM_API_KEY:0:8}..."
          echo "=============================================="
          
          # Thực thi Strix và ghi lại toàn bộ log chi tiết
          strix -n --target "$TARGET_URL" 2>&1 | tee reports/security/strix_scan_live_output.log || true
          
          echo ""
          echo "=== Scan finished. Collecting reports... ==="
          
          # Thu thập tất cả các file report sinh ra
          for dir in "$HOME/.strix" "strix_report" "strix_reports" ".strix"; do
            if [ -d "$dir" ]; then
              echo "Found report dir: $dir"
              cp -r "$dir"/* reports/security/ 2>/dev/null || true
            fi
          done
          
          # Liệt kê tất cả file báo cáo
          echo ""
          echo "=== Report files ==="
          find reports/security/ -type f -exec ls -lh {} \;
          echo "Scan completed at $(date)" >> reports/security/scan_summary.txt

      - name: Upload Security Pentest Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-security-audit-report
          path: reports/security/
          retention-days: 14
