name: Strix AI Penetration Testing & Vulnerability Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: local test instance)"
        required: false
        default: "http://localhost:3000"
      model_provider:
        description: "LLM Model Provider"
        required: false
        default: "google"
        type: choice
        options:
          - google
          - openai
          - anthropic
      model_name:
        description: "Custom Model Name (default for Google: gemini/gemini-3.6-flash)"
        required: false
        default: "gemini/gemini-3.6-flash"
      api_key_input:
        description: "Direct API Key (Optional fallback if Secret not found)"
        required: false
        default: ""
  schedule:
    # Chạy quét định kỳ tự động mỗi tuần (0h00 Thứ 2)
    - cron: '0 0 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  strix-security-scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truliva_test
          POSTGRES_PASSWORD: truliva_test_password
          POSTGRES_DB: truliva_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Python 3.12 (For Strix)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Docker is available (Required by Strix Sandbox)
        run: |
          docker --version
          docker info --format '{{.ServerVersion}}' || echo "Docker daemon info not available"

      - name: Install Strix CLI Agent
        run: |
          python -m pip install --upgrade pip
          pip install strix-agent
          which strix

      - name: Install Truliva Dependencies & Migrate Test Database
        env:
          DATABASE_URL: "postgresql://truliva_test:truliva_test_password@localhost:5432/truliva_test_db?schema=public"
          JWT_SECRET: "test_jwt_secret_strix_security_scan_key"
        run: |
          npm install --legacy-peer-deps
          npx prisma db push --accept-data-loss
          npx prisma generate
          npx tsc || true

      - name: Start Truliva Backend in Background
        env:
          PORT: 3000
          DATABASE_URL: "postgresql://truliva_test:truliva_test_password@localhost:5432/truliva_test_db?schema=public"
          JWT_SECRET: "test_jwt_secret_strix_security_scan_key"
          NODE_ENV: "test"
        run: |
          node dist/index.js &
          echo "Waiting for server to start..."
          sleep 15
          echo "=== Checking server health ==="
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:3000/ || echo "Server may not be fully ready"
          curl -s http://localhost:3000/api/health 2>/dev/null || echo "No /api/health endpoint, but server may still be running"

      - name: Run Strix Autonomous AI Pentest Scan
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_provider || 'google' }}
          CUSTOM_MODEL: ${{ github.event.inputs.model_name }}
          DIRECT_KEY: ${{ github.event.inputs.api_key_input }}
          SECRET_GEMINI: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_GEMINI_API_KEY }}
          SECRET_OPENAI: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY }}
          SECRET_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
        run: |
          mkdir -p reports/security
          mkdir -p ~/.strix
          
          echo "=============================================="
          echo "  STRIX AI PENETRATION TESTING INITIALIZATION"
          echo "=============================================="
          
          # Chọn API key phù hợp từ Direct Input hoặc GitHub Secrets
          ACTIVE_KEY=""
          if [ -n "$DIRECT_KEY" ]; then
            echo "::add-mask::$DIRECT_KEY"
            ACTIVE_KEY="$DIRECT_KEY"
            echo "=> Using API Key from workflow direct input."
          elif [ "$MODEL_CHOICE" = "google" ] && [ -n "$SECRET_GEMINI" ]; then
            ACTIVE_KEY="$SECRET_GEMINI"
            echo "=> Using GEMINI_API_KEY from GitHub Secrets."
          elif [ "$MODEL_CHOICE" = "anthropic" ] && [ -n "$SECRET_ANTHROPIC" ]; then
            ACTIVE_KEY="$SECRET_ANTHROPIC"
            echo "=> Using ANTHROPIC_API_KEY from GitHub Secrets."
          elif [ -n "$SECRET_OPENAI" ]; then
            ACTIVE_KEY="$SECRET_OPENAI"
            echo "=> Using OPENAI_API_KEY from GitHub Secrets."
          elif [ -n "$SECRET_GEMINI" ]; then
            ACTIVE_KEY="$SECRET_GEMINI"
            MODEL_CHOICE="google"
            echo "=> Fallback: Using GEMINI_API_KEY from GitHub Secrets."
          fi
          
          if [ -z "$ACTIVE_KEY" ]; then
            echo "❌ ERROR: No API Key found!"
            echo "Vui lòng kiểm tra lại Secret 'GEMINI_API_KEY' trong GitHub Settings hoặc nhập trực tiếp key vào ô 'api_key_input' khi bấm Run workflow."
            exit 1
          fi
          
          echo "::add-mask::$ACTIVE_KEY"
          
          # Cấu hình Model & Environment
          if [ -n "$CUSTOM_MODEL" ]; then
            export STRIX_LLM="$CUSTOM_MODEL"
          elif [ "$MODEL_CHOICE" = "google" ]; then
            export STRIX_LLM="gemini/gemini-3.6-flash"
          elif [ "$MODEL_CHOICE" = "anthropic" ]; then
            export STRIX_LLM="anthropic/claude-3-5-sonnet-20241022"
          else
            export STRIX_LLM="openai/gpt-4o"
          fi
          
          export LLM_API_KEY="$ACTIVE_KEY"
          export GEMINI_API_KEY="$ACTIVE_KEY"
          export GOOGLE_API_KEY="$ACTIVE_KEY"
          export OPENAI_API_KEY="$ACTIVE_KEY"
          export ANTHROPIC_API_KEY="$ACTIVE_KEY"
          
          # Ghi cấu hình cố định vào ~/.strix/cli-config.json cho Strix
          cat << EOF > ~/.strix/cli-config.json
          {
            "env": {
              "STRIX_LLM": "$STRIX_LLM",
              "LLM_API_KEY": "$ACTIVE_KEY",
              "GEMINI_API_KEY": "$ACTIVE_KEY",
              "GOOGLE_API_KEY": "$ACTIVE_KEY",
              "OPENAI_API_KEY": "$ACTIVE_KEY",
              "ANTHROPIC_API_KEY": "$ACTIVE_KEY"
            }
          }
          EOF
          
          TARGET_URL="${{ github.event.inputs.target_url || 'http://localhost:3000' }}"
          echo "Target URL: $TARGET_URL"
          echo "Model:      $STRIX_LLM"
          echo "API Key:    Valid (Length: ${#ACTIVE_KEY} chars)"
          echo "=============================================="
          
          # Thực thi Strix và ghi lại toàn bộ log chi tiết
          strix -n --target "$TARGET_URL" 2>&1 | tee reports/security/strix_scan_live_output.log || true
          
          echo ""
          echo "=== Scan finished. Collecting reports... ==="
          
          # Thu thập tất cả các file report sinh ra
          for dir in "$HOME/.strix" "strix_report" "strix_reports" ".strix"; do
            if [ -d "$dir" ]; then
              echo "Found report dir: $dir"
              cp -r "$dir"/* reports/security/ 2>/dev/null || true
            fi
          done
          
          # Liệt kê tất cả file báo cáo
          echo ""
          echo "=== Report files ==="
          find reports/security/ -type f -exec ls -lh {} \;
          echo "Scan completed at $(date)" >> reports/security/scan_summary.txt

      - name: Upload Security Pentest Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-security-audit-report
          path: reports/security/
          retention-days: 14
