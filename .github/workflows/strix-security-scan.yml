name: Strix AI Penetration Testing & Vulnerability Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: local test instance)"
        required: false
        default: "http://localhost:3000"
      model_provider:
        description: "LLM Model Provider (openai, anthropic, google)"
        required: false
        default: "openai"
        type: choice
        options:
          - openai
          - anthropic
          - google
  schedule:
    # Chạy quét định kỳ tự động mỗi tuần (0h00 Thứ 2)
    - cron: '0 0 * * 1'

jobs:
  strix-security-scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truliva_test
          POSTGRES_PASSWORD: truliva_test_password
          POSTGRES_DB: truliva_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.12 (For Strix)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Strix CLI Agent
        run: |
          python -m pip install --upgrade pip
          pip install strix-agent

      - name: Install Truliva Dependencies & Migrate Test Database
        env:
          DATABASE_URL: "postgresql://truliva_test:truliva_test_password@localhost:5432/truliva_test_db?schema=public"
          JWT_SECRET: "test_jwt_secret_strix_security_scan_key"
        run: |
          npm install --legacy-peer-deps
          npx prisma db push --accept-data-loss
          npx prisma generate
          npm run build

      - name: Start Truliva Backend & Webapp in Background
        env:
          PORT: 3000
          DATABASE_URL: "postgresql://truliva_test:truliva_test_password@localhost:5432/truliva_test_db?schema=public"
          JWT_SECRET: "test_jwt_secret_strix_security_scan_key"
          NODE_ENV: "test"
        run: |
          npm start &
          # Chờ server khởi động hoàn tất
          sleep 10
          curl --retry 5 --retry-delay 3 http://localhost:3000/api/health || curl http://localhost:3000/

      - name: Run Strix Autonomous AI Pentest Scan
        env:
          MODEL_CHOICE: ${{ github.event.inputs.model_provider || 'google' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p reports/security
          echo "=== 1. Starting Strix AI Pentesting Scan ==="
          
          # Thiết lập STRIX_LLM và LLM_API_KEY tương thích với LiteLLM
          if [ "$MODEL_CHOICE" = "google" ] || [ -n "$GEMINI_API_KEY" ]; then
            echo "Using Google Gemini LLM Provider (gemini-2.0-flash)"
            export STRIX_LLM="gemini/gemini-2.0-flash"
            export LLM_API_KEY="$GEMINI_API_KEY"
            export GEMINI_API_KEY="$GEMINI_API_KEY"
          elif [ "$MODEL_CHOICE" = "anthropic" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Using Anthropic Claude LLM Provider"
            export STRIX_LLM="anthropic/claude-3-5-sonnet-20241022"
            export LLM_API_KEY="$ANTHROPIC_API_KEY"
          else
            echo "Using OpenAI LLM Provider"
            export STRIX_LLM="openai/gpt-4o"
            export LLM_API_KEY="$OPENAI_API_KEY"
          fi
          
          TARGET_URL="${{ github.event.inputs.target_url || 'http://localhost:3000' }}"
          echo "Target URL: $TARGET_URL"
          echo "STRIX_LLM: $STRIX_LLM"
          
          # Thực thi Strix và ghi lại toàn bộ log chi tiết
          strix -n --target "$TARGET_URL" 2>&1 | tee reports/security/strix_scan_live_output.log || true
          
          # Thu thập tất cả các file report sinh ra từ ~/.strix hoặc workspace
          if [ -d "$HOME/.strix" ]; then
            cp -r $HOME/.strix/* reports/security/ || true
          fi
          if [ -d "strix_report" ]; then
            cp -r strix_report/* reports/security/ || true
          fi
          
          echo "Strix Security Scan completed for target: $TARGET_URL at $(date)" > reports/security/scan_summary.txt
          ls -la reports/security/

      - name: Upload Security Pentest Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strix-security-audit-report
          path: reports/security/
          retention-days: 14
