name: Deploy Truliva System

# TẠM TẮT tự động deploy khi push lên main (13/11/2026):
#  - /var/www/truliva trên VPS không còn đồng bộ git (lệch ~298 commit, ~178 file deploy qua SFTP)
#    → `git pull` lỗi nhưng script vẫn chạy tiếp `prisma db push` với schema cũ trên VPS.
#  - Secret VPS_PASSWORD đã cũ sau khi đổi mật khẩu root ngày 12/11.
# Chỉ chạy thủ công (Actions → Run workflow) sau khi đã sửa lại quy trình deploy.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "=== Starting Automatic Deployment ==="
            cd /var/www/truliva
            
            echo "=== 1. Pulling latest code ==="
            git pull origin main
            
            echo "=== 2. Installing Backend Dependencies ==="
            npm install --legacy-peer-deps
            
            echo "=== 3. Updating Database Schema ==="
            npx prisma generate
            npx prisma db push
            
            echo "=== 4. Building Backend Only (TypeScript) ==="
            npx tsc
            
            echo "=== 5. Restarting Backend Server ==="
            pm2 restart truliva-backend
            
            echo "=== CI/CD Deployment Successfully Completed! ==="

Truliva calling system
