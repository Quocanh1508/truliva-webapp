# =====================================================================
# Strix AI Penetration Testing Configuration for Truliva System
# Repository: https://github.com/usestrix/strix
# =====================================================================

version: "1.0"

# Mục tiêu kiểm thử bảo mật
target:
  name: "Truliva Web Application & API Backend"
  # URL kiểm thử mặc định (Local dev/staging sandbox)
  url: "http://localhost:3000"
  
# Phạm vi quét (Scope definition)
scope:
  include:
    - "http://localhost:3000/api/**"
    - "http://localhost:3000/admin/**"
    - "http://localhost:3000/ktv/**"
    - "http://localhost:3000/auth/**"
  
  # Loại trừ các webhook bên thứ 3 và các endpoint gửi thông báo thật trong quá trình test
  exclude:
    - "http://localhost:3000/api/pancake/webhook"
    - "http://localhost:3000/api/zalo/webhook"
    - "http://localhost:3000/api/broadcast"

# Cấu hình AI Agent & Sandbox
agent:
  model_provider: "google"
  model_name: "gemini/gemini-3.6-flash"
  max_iterations: 15
  sandbox:
    docker_image: "ghcr.io/usestrix/strix-sandbox:latest"
    timeout_seconds: 1200

# Tiêu chí kiểm thử bảo mật cốt lõi
tests:
  - id: "auth-rbac-bypass"
    name: "Kiểm tra leo thang đặc quyền Role (ADMIN vs COORDINATOR vs KTV vs STAFF)"
    enabled: true

  - id: "idor-orders-customers"
    name: "Kiểm tra lỗi IDOR xem/sửa đơn hàng, thông tin khách hàng, báo cáo bảo trì"
    enabled: true

  - id: "injection-sqli-nosql"
    name: "Kiểm tra SQL/Prisma Injection & Parameter Tampering"
    enabled: true

  - id: "api-rate-limit"
    name: "Kiểm tra giới hạn tần suất Rate Limit & OTP Brute-force"
    enabled: true

  - id: "xss-csrf-cors"
    name: "Kiểm tra Cross-Site Scripting, CSRF và cấu hình CORS Header"
    enabled: true

# Cấu hình xuất báo cáo
reporting:
  output_dir: "./reports/security"
  formats:
    - "html"
    - "json"
    - "markdown"
  require_poc: true # Chỉ báo cáo các lỗ hổng đã xác thực thành công kèm Proof-of-Concept
